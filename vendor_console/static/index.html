<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Console</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ── Login ───────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <h1>Vendor Console</h1>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@answerer.internal" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
    <button class="btn btn-primary btn-full" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App shell ───────────────────────────────────────────────────────────── -->
<div id="app-shell" hidden>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Vendor Console</span>
    </div>

    <nav id="sidebar-nav">
      <div class="nav-section">Management</div>
      <button class="nav-item active" data-tab="tenants">Tenants</button>
    </nav>

    <div class="sidebar-footer">
      <span class="sidebar-user" id="logged-in-as"></span>
      <button class="btn btn-secondary btn-full btn-sm" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main id="main-content">

    <!-- TENANTS ──────────────────────────────────────────────────────────── -->
    <div id="tab-tenants" class="tab-panel active">
      <div class="page-header">
        <div>
          <h1>Tenants</h1>
          <p>Click any row to expand activity detail.</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="refresh-btn">↻ Refresh</button>
      </div>

      <div id="stat-cards" style="display:none">
        <div class="stat-cards">
          <div class="stat-card">
            <div class="stat-label">Total tenants</div>
            <div class="stat-value" id="stat-total">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active</div>
            <div class="stat-value" id="stat-active">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Suspended</div>
            <div class="stat-value" id="stat-suspended">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Avg quota used</div>
            <div class="stat-value" id="stat-avg-quota">—</div>
          </div>
        </div>
      </div>

      <div id="table-wrap" class="card card-flush">
        <div class="loading">Loading…</div>
      </div>
    </div>

  </main>
</div>

<script>
const BASE = '';
const ADMIN_CONSOLE_URL = 'https://admin-console-848760828618.us-central1.run.app';

let accessToken = null;

// ── Utilities ─────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(s) { return s ? new Date(s).toLocaleString() : '—'; }

// ── Auth ──────────────────────────────────────────────────────────────────────

async function login() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('login-btn');
  document.getElementById('login-error').textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res  = await fetch(`${BASE}/v1/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('login-error').textContent = data.message || data.detail || 'Login failed';
      return;
    }
    accessToken = data.access_token;
    document.getElementById('logged-in-as').textContent = email;
    document.getElementById('login-screen').style.display  = 'none';
    document.getElementById('app-shell').removeAttribute('hidden');
    loadTenants();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Network error';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function logout() {
  try {
    await fetch(`${BASE}/v1/auth/logout`, {
      method: 'POST', headers: {'Authorization': `Bearer ${accessToken}`}
    });
  } catch(_) {}
  accessToken = null;
  document.getElementById('app-shell').setAttribute('hidden', '');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password').value = '';
}

document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('refresh-btn').addEventListener('click', loadTenants);

// ── Tenants ───────────────────────────────────────────────────────────────────

async function loadTenants() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="loading">Loading…</div>';
  try {
    const res = await fetch(`${BASE}/v1/tenants?limit=200`, {
      headers: {'Authorization': `Bearer ${accessToken}`},
    });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    renderTable(data.items || []);
  } catch(e) {
    wrap.innerHTML = '<div class="msg-err loading">Failed to load tenants.</div>';
  }
}

function renderStats(tenants) {
  const total     = tenants.length;
  const suspended = tenants.filter(t => t.suspended).length;
  const active    = total - suspended;
  const avgPct    = total
    ? (tenants.reduce((s, t) => s + (t.quota_utilisation_pct || 0), 0) / total).toFixed(1)
    : 0;
  document.getElementById('stat-total').textContent     = total;
  document.getElementById('stat-active').textContent    = active;
  const suspEl = document.getElementById('stat-suspended');
  suspEl.textContent = suspended;
  suspEl.className   = 'stat-value' + (suspended > 0 ? ' danger' : '');
  const avgEl  = document.getElementById('stat-avg-quota');
  avgEl.textContent  = avgPct + '%';
  avgEl.className    = 'stat-value' + (avgPct >= 90 ? ' danger' : avgPct >= 70 ? ' warn' : '');
  document.getElementById('stat-cards').style.display = 'block';
}

function renderTable(tenants) {
  const wrap = document.getElementById('table-wrap');
  if (!tenants.length) {
    wrap.innerHTML = '<div class="empty-state">No tenants yet.</div>'; return;
  }
  renderStats(tenants);

  const rows = tenants.map(t => {
    const pct    = Math.min(t.quota_utilisation_pct || 0, 100).toFixed(1);
    const barCls = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : '';
    const badge  = t.suspended
      ? '<span class="badge badge-red">Suspended</span>'
      : '<span class="badge badge-green">Active</span>';
    const src = t.source_breakdown_7d || {};

    return `
      <tr class="summary-row" data-id="${t.tenant_id}">
        <td><button class="expand-btn" data-id="${t.tenant_id}" title="Expand">▶</button></td>
        <td>
          <strong>${esc(t.name)}</strong>
          <div class="mono muted small">${esc(t.tenant_id)}</div>
        </td>
        <td>${badge}</td>
        <td>${esc(t.plan || '—')}</td>
        <td>
          <div class="bar-wrap">
            <div class="bar"><div class="bar-fill ${barCls}" style="width:${pct}%"></div></div>
            <span class="bar-pct">${pct}%</span>
          </div>
        </td>
        <td>
          <div class="quota-edit">
            <input type="number" id="quota-${t.tenant_id}" value="${t.questions_quota}" min="0" onclick="event.stopPropagation()">
            <button class="btn btn-primary btn-sm" data-id="${t.tenant_id}" data-action="save-quota" onclick="event.stopPropagation()">Save</button>
          </div>
        </td>
        <td class="nowrap">${t.questions_7d} / ${t.questions_30d}</td>
        <td onclick="event.stopPropagation()">
          <a class="btn btn-secondary btn-sm" href="${ADMIN_CONSOLE_URL}" target="_blank" rel="noopener">Open ↗</a>
        </td>
      </tr>
      <tr class="detail-row hidden" id="detail-${t.tenant_id}">
        <td colspan="8">
          <div class="detail-panel">
            <div class="detail-cell">
              <div class="detail-cell-label">Sources — 7 days</div>
              <div class="detail-cell-value">
                <div class="src-grid">
                  <div class="src-item"><span class="src-label">RAG</span><span class="src-count">${src.rag||0}</span></div>
                  <div class="src-item"><span class="src-label">Curated</span><span class="src-count">${src.curated||0}</span></div>
                  <div class="src-item"><span class="src-label">Guardrail</span><span class="src-count">${src.guardrail||0}</span></div>
                  <div class="src-item"><span class="src-label">Error</span><span class="src-count">${src.error||0}</span></div>
                </div>
              </div>
            </div>
            <div class="detail-cell">
              <div class="detail-cell-label">Error rate — 7 days</div>
              <div class="detail-cell-value">${t.error_rate_7d_pct != null ? t.error_rate_7d_pct.toFixed(1) + '%' : '—'}</div>
            </div>
            <div class="detail-cell">
              <div class="detail-cell-label">Avg response — 7 days</div>
              <div class="detail-cell-value">${t.avg_response_ms_7d != null ? t.avg_response_ms_7d + ' ms' : '—'}</div>
            </div>
            <div class="detail-cell">
              <div class="detail-cell-label">Last question</div>
              <div class="detail-cell-value small">${fmtDate(t.last_question_at)}</div>
              <div class="detail-cell-label">Last indexed</div>
              <div class="detail-cell-value small">${fmtDate(t.last_indexed_at)}</div>
            </div>
          </div>
        </td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Tenant</th>
          <th>Status</th>
          <th>Plan</th>
          <th>Quota used</th>
          <th>Quota limit</th>
          <th>Q 7d / 30d</th>
          <th>Admin Console</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`;
}

// ── Row expand / collapse ─────────────────────────────────────────────────────

document.getElementById('table-wrap').addEventListener('click', async e => {
  // Save quota
  const saveBtn = e.target.closest('[data-action="save-quota"]');
  if (saveBtn) {
    await saveQuota(saveBtn.dataset.id, saveBtn);
    return;
  }

  // Expand row — click anywhere on summary row
  const row = e.target.closest('.summary-row');
  if (!row) return;
  const id        = row.dataset.id;
  const detailRow = document.getElementById(`detail-${id}`);
  const btn       = row.querySelector('.expand-btn');
  if (!detailRow) return;

  const isOpen = !detailRow.classList.contains('hidden');
  detailRow.classList.toggle('hidden', isOpen);
  btn.textContent = isOpen ? '▶' : '▼';
});

// ── Save quota ────────────────────────────────────────────────────────────────

async function saveQuota(tenantId, btn) {
  const input = document.getElementById(`quota-${tenantId}`);
  const quota = parseInt(input.value, 10);
  if (isNaN(quota) || quota < 0) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  try {
    const res = await fetch(`${BASE}/v1/tenants/${tenantId}/quota`, {
      method: 'PUT',
      headers: {'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json'},
      body: JSON.stringify({questions_quota: quota}),
    });
    if (res.ok) {
      btn.textContent = 'Saved';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    } else {
      btn.textContent = 'Error'; btn.disabled = false;
    }
  } catch(_) { btn.textContent = 'Error'; btn.disabled = false; }
}
</script>
</body>
</html>
