    button.run { background: #1a6b3a; color: #fff; }
    button.stop { background: #c0392b; color: #fff; }
    button.clear { background: #222; color: #aaa; }

    .stats-bar { display: flex; background: #111; border-bottom: 1px solid #222; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 90px; padding: 10px 16px; border-right: 1px solid #1a1a1a; }
    .stat:last-child { border-right: none; }
    .stat .lbl { font-size: 0.68rem; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .stat .val { font-size: 1.3rem; font-weight: 700; color: #fff; }
    .stat .val.green { color: #27ae60; }
    .stat .val.red { color: #e74c3c; }
    .stat .val.blue { color: #3498db; }
    .stat .val.amber { color: #f39c12; }
    .stat .val.purple { color: #9b59b6; }
    .stat .val.teal { color: #1abc9c; }
    .stat .val.orange { color: #e67e22; }

    .progress-track { background: #222; border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #1a6b3a, #27ae60); border-radius: 99px; width: 0%; transition: width 0.25s; }
    .progress-label { font-size: 0.73rem; color: #666; margin-top: 5px; }

    .cat-section { margin: 16px 24px 0; }
    .cat-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #555; padding: 6px 0 8px; border-bottom: 1px solid #1a1a1a; margin-bottom: 8px; }

    .results { padding: 0 24px 24px; display: flex; flex-direction: column; gap: 6px; }
    .result-card { background: #111; border: 1px solid #1e1e1e; border-radius: 6px; overflow: hidden; }
    .result-card.success { border-left: 3px solid #27ae60; }
    .result-card.error { border-left: 3px solid #e74c3c; }
    .result-card.pending { border-left: 3px solid #333; }
    .result-card.running { border-left: 3px solid #3498db; animation: pulse-b 1s infinite; }
    @keyframes pulse-b { 0%,100% { border-left-color: #3498db; } 50% { border-left-color: #1a4060; } }

    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; cursor: pointer; user-select: none; }
    .card-q { font-size: 0.82rem; font-weight: 500; color: #ccc; flex: 1; padding-right: 10px; }
    .card-q .q-num { color: #555; font-weight: 400; margin-right: 6px; font-size: 0.75rem; }
    .card-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    .badge { padding: 2px 7px; border-radius: 99px; font-size: 0.68rem; font-weight: 600; }
    .badge.ok { background: #1a3d2b; color: #27ae60; }
    .badge.err { background: #3d1a1a; color: #e74c3c; }
    .badge.wait { background: #1a1a1a; color: #444; }
    .badge.run { background: #1a2d3d; color: #3498db; }
    .badge.src-rag { background: #1a2a3d; color: #5dade2; }
    .badge.src-curated { background: #1e2d1a; color: #58d68d; }
    .badge.src-guardrail { background: #2d1a1a; color: #e59866; }
    .badge.src-error { background: #3d1a1a; color: #e74c3c; }
    .time-lbl { font-size: 0.72rem; color: #555; }
    .chevron { color: #444; transition: transform 0.18s; font-size: 0.7rem; }
    .chevron.open { transform: rotate(180deg); }

    .card-body { display: none; padding: 10px 12px; border-top: 1px solid #161616; font-size: 0.8rem; line-height: 1.65; color: #aaa; }

    @keyframes spin { to { transform: rotate(360deg); } }

    #empty-state { padding: 48px 24px; text-align: center; color: #333; font-size: 0.85rem; }
  </style>
</head>

let running = false;
let aborted = false;
let latencies = [];
let doneCount = 0;
let errCount = 0;
const srcCounts = { rag: 0, curated: 0, guardrail: 0 };

function stopRun() {
  aborted = true;
  document.getElementById('stopBtn').disabled = true;
}

function clearResults() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('empty-state').style.display = '';
  latencies = [];
  doneCount = 0;
  errCount = 0;
  srcCounts.rag = 0;
  srcCounts.curated = 0;
  srcCounts.guardrail = 0;
  updateStats();
  document.getElementById('progressWrap').style.display = 'none';
}

function updateStats() {
  const total = doneCount + errCount;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sDone').textContent = doneCount;
  document.getElementById('sErrors').textContent = errCount;
  document.getElementById('sSrcRag').textContent = srcCounts.rag;
  document.getElementById('sSrcCurated').textContent = srcCounts.curated;
  document.getElementById('sSrcGuardrail').textContent = srcCounts.guardrail;
  if (latencies.length) {
    const sorted = [...latencies].sort((a,b) => a-b);
    const avg = Math.round(latencies.reduce((a,b)=>a+b,0) / latencies.length);
    const p95idx = Math.min(Math.floor(sorted.length * 0.95), sorted.length - 1);
    const p95 = sorted[p95idx];
    document.getElementById('sAvgMs').textContent = avg + 'ms';
    document.getElementById('sP95').textContent = p95 + 'ms';
    document.getElementById('sMin').textContent = sorted[0] + 'ms';
    document.getElementById('sMax').textContent = sorted[sorted.length-1] + 'ms';
  } else {
    ['sAvgMs','sP95','sMin','sMax'].forEach(id => document.getElementById(id).textContent = '—');
  }
}

function srcBadgeClass(src) {
  if (!src) return 'badge wait';
  return 'badge src-' + src;
}

function makeCard(globalIdx, question) {
  const card = document.createElement('div');
  card.className = 'result-card pending';
  card.id = `card-${globalIdx}`;
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(${globalIdx})">
      <div class="card-q"><span class="q-num">${globalIdx+1}.</span>${escHtml(question)}</div>
      <div class="card-meta">
        <span class="badge wait" id="badge-${globalIdx}">Waiting</span>
        <span class="time-lbl" id="time-${globalIdx}"></span>
        <span class="chevron" id="chev-${globalIdx}">▼</span>
      </div>
    </div>
    <div class="card-body" id="body-${globalIdx}"></div>
  `;
  return card;
}

function toggleCard(idx) {
  document.getElementById(`body-${idx}`).classList.toggle('open');
  document.getElementById(`chev-${idx}`).classList.toggle('open');
}

function setRunning(idx) {
  document.getElementById(`card-${idx}`).className = 'result-card running';
  const badge = document.getElementById(`badge-${idx}`);
  badge.className = 'badge run';
  badge.innerHTML = '<span class="spinner"></span>';
}

  document.getElementById(`card-${idx}`).className = 'result-card success';

  badge.className = srcBadgeClass(src);
  badge.textContent = src || 'ok';
  document.getElementById(`time-${idx}`).textContent = ms + 'ms';
  document.getElementById(`body-${idx}`).innerHTML =
    `<div class="answer-text">${escHtml(answer)}</div>` +
    `<div class="meta-row"><span>${ms}ms</span><span>source: ${src || '—'}</span></div>`;
}

function setError(idx, ms, msg) {
  document.getElementById(`card-${idx}`).className = 'result-card error';
  const badge = document.getElementById(`badge-${idx}`);
  badge.className = 'badge err';
  badge.textContent = 'ERR';
  if (ms) document.getElementById(`time-${idx}`).textContent = ms + 'ms';
  document.getElementById(`body-${idx}`).innerHTML = `<div class="err-msg">${escHtml(msg)}</div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function runQuery(globalIdx, question, baseUrl, tenantId, widgetKey) {
  if (aborted) return;
  setRunning(globalIdx);
  const t0 = Date.now();
  try {
    const res = await fetch(`${baseUrl}/v1/tenants/${tenantId}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Widget-Key': widgetKey },
      body: JSON.stringify({ question }),
    });
    const ms = Date.now() - t0;
    if (!res.ok) {
      const txt = await res.text();
      setError(globalIdx, ms, `HTTP ${res.status}: ${txt}`);
      errCount++;
    } else {
      const data = await res.json();
      const answer = data.answer ?? JSON.stringify(data);
      const src = data.source;
      setDone(globalIdx, ms, answer, src);
      latencies.push(ms);
      doneCount++;
      if (src && src in srcCounts) srcCounts[src]++;
    }
  } catch(e) {
    const ms = Date.now() - t0;
    setError(globalIdx, ms, e.message);
    errCount++;
  }
  updateStats();
}

async function startRun() {
  const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
  const tenantId = document.getElementById('tenantId').value.trim();
  const widgetKey = document.getElementById('widgetKey').value.trim();
  const concurrency = Math.max(1, Math.min(30, parseInt(document.getElementById('concurrency').value) || 8));

  if (!tenantId || !widgetKey) { alert('Enter Tenant ID and Widget Key.'); return; }

  aborted = false;
  latencies = [];
  doneCount = 0;
  errCount = 0;
  srcCounts.rag = 0;
  srcCounts.curated = 0;
  srcCounts.guardrail = 0;
  updateStats();

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('runBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('progressWrap').style.display = 'block';

  // Build DOM: category headers + cards
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = '';

  CATEGORIES.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'cat-section';
    const title = document.createElement('div');
    title.className = 'cat-title';
    title.textContent = `${cat.label} (${cat.count})`;
    section.appendChild(title);
    for (let i = cat.start; i < cat.start + cat.count && i < QUESTIONS.length; i++) {
      section.appendChild(makeCard(i, QUESTIONS[i]));
    }
    resultsEl.appendChild(section);
  });

  const total = QUESTIONS.length;
  let next = 0;

  async function worker() {
    while (next < total && !aborted) {
      const idx = next++;
      await runQuery(idx, QUESTIONS[idx], baseUrl, tenantId, widgetKey);
      const done = doneCount + errCount;
      document.getElementById('progressFill').style.width = (done / total * 100) + '%';
      document.getElementById('progressLabel').textContent = `${done} / ${total}`;
    }
  }

  await Promise.all(Array.from({ length: concurrency }, () => worker()));

  document.getElementById('runBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
  const done = doneCount + errCount;
  document.getElementById('progressLabel').textContent = aborted
    ? `Stopped at ${done} / ${total} — ${doneCount} ok, ${errCount} errors`
    : `Complete — ${doneCount} ok, ${errCount} errors`;
}
</script>
